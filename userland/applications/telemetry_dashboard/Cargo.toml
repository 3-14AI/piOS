[package]
name = "telemetry_dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { version = "1.9", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "std", "renderer-software"] }

[build-dependencies]
slint-build = "1.9"

[lib]
name = "telemetry_dashboard"
path = "src/lib.rs"
crate-type = ["rlib"]

[lints]
workspace = true
