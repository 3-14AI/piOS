[workspace]
members = [
    "kernel",
    "libs/pios-common",
    "libs/pios-api",
    "tools/builder",
    "test_wasi",
    "libs/vector_db",
    "libs/llm_context",
    "libs/inference_runtime",
    "libs/compiler_frontend",
    "libs/z3_smt",
    "userland/services/net_stack",
    "userland/services/wgpu_compositor",
    "userland/services/nl_sh",
    "userland/services/slint_gui",
    "userland/services/init",
    "userland/services/package_manager",
    "libs/libc_compat",
    "userland/applications/hello_world",
    "userland/applications/pkg_cli",
    "userland/services/installer",
    "userland/applications/coreutils",
    "userland/applications/ide",
    "userland/applications/llm_runner",
    "userland/services/semantic_logger",
    "userland/services/sys_optimizer"
, "userland/services/ids_ips", "userland/services/app_preloader", "userland/services/nl_desktop", "libs/llm_inference", "userland/services/driver_synthesizer"]
exclude = [
    "tools/verus"
]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_verify_core)'] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
panic = "abort"

[profile.test]
panic = "abort"
